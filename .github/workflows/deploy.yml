name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm check
      - name: Build production web application
        run: corepack pnpm --filter @scheduler/web build
        env:
          VITE_APP_URL: ${{ vars.APP_URL }}
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_DEMO_MODE: "false"
          VITE_OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          VITE_PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
      - name: Deploy Worker
        run: corepack pnpm --filter @scheduler/worker exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy web to Cloudflare Pages
        run: corepack pnpm exec wrangler pages deploy apps/web/dist --project-name postline --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
