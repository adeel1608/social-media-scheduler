name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to confirm a deliberate production release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: corepack pnpm install --frozen-lockfile
      - name: Validate production deployment configuration
        run: corepack pnpm deploy:validate
        env:
          DEPLOY_CONFIRM: ${{ inputs.confirm }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_APP_URL: ${{ vars.APP_URL }}
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_DEMO_MODE: "false"
          VITE_OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          VITE_PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - run: corepack pnpm check
      - name: Build production web application
        run: corepack pnpm --filter @scheduler/web build
        env:
          VITE_APP_URL: ${{ vars.APP_URL }}
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_DEMO_MODE: "false"
          VITE_OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          VITE_PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
      - name: Verify required production database migration
        run: corepack pnpm db:verify:production
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Deploy Worker
        run: >-
          corepack pnpm --filter @scheduler/worker exec wrangler deploy
          --name "$CLOUDFLARE_WORKER_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      - name: Deploy web to Cloudflare Pages
        run: >-
          corepack pnpm --dir apps/worker exec wrangler pages deploy apps/web/dist
          --cwd ../..
          --project-name "$CLOUDFLARE_PAGES_PROJECT"
          --branch "${{ github.event.repository.default_branch }}"
          --commit-hash "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
