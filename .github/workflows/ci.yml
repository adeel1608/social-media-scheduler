name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm format:check
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm build:verify
      - run: corepack pnpm db:validate
      - name: Start disposable Supabase and apply migrations
        run: corepack pnpm exec supabase start >/dev/null
      - name: Verify migrations against PostgreSQL
        run: corepack pnpm db:test
      - name: Stop disposable Supabase
        if: always()
        run: corepack pnpm exec supabase stop --no-backup
      - run: corepack pnpm secrets:scan
      - run: corepack pnpm audit:ci

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: corepack pnpm install --frozen-lockfile
      - name: Verify production-mode web configuration
        run: corepack pnpm --filter @scheduler/web build
        env:
          VITE_DEMO_MODE: "false"
          VITE_APP_URL: https://postline-ci.pages.dev
          VITE_API_URL: https://postline-ci.workers.dev
          VITE_SUPABASE_URL: https://postline-ci.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_CI_ONLY_NOT_A_CREDENTIAL_1234567890
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          VITE_OPERATOR_NAME: Postline CI
          VITE_PUBLIC_CONTACT_EMAIL: ci-contact@postline.dev
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: corepack pnpm test:e2e

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
