packages:
  - apps/*
  - packages/*

overrides:
  effect: 3.20.0

allowBuilds:
  esbuild: true
  # Optional native msgpackr acceleration; Cloudflare Workers use the JS path.
  msgpackr-extract: false
  supabase: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260903.1"
  - "@supabase/auth-js@2.114.0"
  - "@supabase/functions-js@2.114.0"
  - "@supabase/postgrest-js@2.114.0"
  - "@supabase/realtime-js@2.114.0"
  - "@supabase/storage-js@2.114.0"
  - "@supabase/supabase-js@2.114.0"
